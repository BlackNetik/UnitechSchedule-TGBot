name: Docker Image CI

on:
  push:
    branches:
      - main
  # Позволяет запустить workflow вручную из интерфейса GitHub Actions
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Имя образа берётся автоматически из имени репозитория (в нижнем регистре)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    # Даём workflow права на запись в GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем QEMU для мультиплатформенной сборки (опционально, но полезно)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Настраиваем Docker Buildx для кэширования слоёв
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Авторизуемся в GitHub Container Registry
      #    GITHUB_TOKEN создаётся автоматически — ничего дополнительно настраивать не нужно
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Формируем теги и метаданные образа
      #    - latest         — всегда указывает на последний коммит в main
      #    - sha-xxxxxxx    — уникальный тег конкретного коммита (для отката)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # 6. Собираем образ и пушим в реестр
      #    --cache-from / --cache-to ускоряют повторные сборки (кэш хранится в реестре)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # 7. Выводим итоговый digest образа в лог для удобства
      - name: Print image digest
        run: echo "Image digest ${{ steps.build-and-push.outputs.digest }}"
